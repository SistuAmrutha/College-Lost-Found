spring.application.name=college-lost-found-backend
server.port=8080

# MongoDB Configuration (Local or MongoDB Atlas connection string)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/college_lost_found}

# JWT Authentication
app.jwt.secret=${JWT_SECRET:CollegeLostAndFoundApp2026SuperSecretKeyMustBeAtLeast32BytesLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS & Frontend Origins
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# File Upload Settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Cloudinary Storage (Optional - fallback to local storage if empty)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Demo & Development Seeding
app.seed.enabled=${SEED_ENABLED:true}

# Swagger OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
